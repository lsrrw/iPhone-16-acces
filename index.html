<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone 16</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="part1">
            <img id="apple" src="imagens/Apple_logo_black.svg" width="60" height="60" alt="Logo Apple">
        </div>
    </header>

    <nav class="menu">
        <img src="imagens/images.png" width="40" height="40" alt="Ícone de acessibilidade">
        <div class="menu-acessibilidade">
            <button id="botao-acessibilidade">Acessibilidade</button>
            <div id="opcoes-acessibilidade">
                <button id="aumentar-fonte">A+</button>
                <button id="diminuir-fonte">A-</button>
            </div>
        </div>
        <ul class="nav">
            <li><a href="#inicio">Início</a></li>
            <li><a href="#galeria">Galeria</a></li>
            <li><a href="#contato">Contato</a></li>
        </ul>
    </nav>

    <main>
        <img id="iphone16" src="imagens/i1.webp" alt="iPhone 16">
        <h1>iPhone 16</h1>
        <div class="part2">
            <a href="https://www.apple.com/br/shop/buy-iphone/iphone-16-pro" class="botao">Ver preços</a>
        </div>
    </main>

    <footer>
        <img id="i16" src="imagens/i16.webp" width="100%" alt="iPhone 16 grande">
        <h2>Conheça o melhor iPhone.</h2>
    </footer>

    <h3>Dark mode / Light mode</h3>
    <div class="trilho" id="trilho">
        <div class="indicador"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
